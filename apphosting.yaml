# apphosting.yaml
# Firebase App Hosting configuration file

runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NODE_ENV
    value: production
  - variable: GOOGLE_PACKAGE_MANAGER
    value: npm
    availability:
      - BUILD
  - variable: GOOGLE_NODEJS_VERSION
    value: "22.x"
    availability:
      - BUILD
